<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">
            <!-- DADOS PESSOAIS -->
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="userName">Nome</label>
                <input type="text" name="userName" id="" required>
                <br>

                <label for="userAge">Idade</label>
                <input type="number" name="userAge" id="" min="12" max="100" required>
                <br>

                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate" id="">
                <br>

                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" id="" required>
                <br>

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" id="" pattern="[0-9]{11}"
                    placeholder="DDD + número sem espaços ou hífen">
                <br>

                <label for="userImage">Upload de foto</label>
                <input type="file" name="userImage" id="" accept="image/*">
                <br>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </section>
</body>

</html>
